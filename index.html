<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Lab 02 | Stock Portfolio Dashboard</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,400,400i,700" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

  <script src="/data/users.js"></script>
  <script src="/data/stocks-complete.js"></script>
  <script src="/app.js"></script>
</head>

<body>

  <header>
    <h1>Lab 02 | Stock Portfolio Dashboard</h1>
  </header>
  <main class="grid-container">

    <section class="user-list-container">
      <h2>Users</h2>
      <ul class="user-list"></ul>
    </section>

    <section class="Details">
      <div class="UserForm">
        <h2>User Form</h2>
        <form class="userEntry">
          <input type=hidden id="userID" />
          <label for="firstname">Name:</label>
          <input type=text placeholder="FirstName" id="firstname" class="one" />
          <input type=text placeholder="LastName" id="lastname" class="two" />
          <label for="address">Address:</label>
          <input type=text placeholder="Address" id="address" class="one" />
          <input type=text placeholder="City" id="city" class="two" />
          <label for="email">Email:</label>
          <input type=email placeholder="Email" id="email" class="both" />
          <button class="one" id="btnSave">Save</button>
          <button class="two" id="btnDelete">Delete</button>
        </form>
      </div>
      <div class="Portfolio">
        <div class="StockList">
          <h2>Portfolio</h2>
          <div class="portfolio-list">
            <h3>Symbol</h3>
            <h3># Shares</h3>
            <h3>Actions</h3>
          </div>
        </div>
        <div class="StockDetails">
          <div class="details-container">
            <h3>Stock Details</h3>
            <div class="details-row"><span class="label">Name:</span> <span class="value" id="stockName"></span></div>
            <div class="details-row"><span class="label">Sector:</span> <span class="value" id="stockSector"></span></div>
            <div class="details-row"><span class="label">Industry:</span> <span class="value" id="stockIndustry"></span></div>
            <div class="details-row"><span class="label">Address:</span> <span class="value" id="stockAddress"></span></div>
            <img id="logo" src="" alt="Company Logo" class="stock-logo" />
          </div>
        </div>
      </div>

    </section> 


  </main>

</body>

</html>
