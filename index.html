<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab 02 | Stock Portfolio Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Lab 02 | Stock Portfolio Dashboard</h1>
  </header>

  <main class="grid-container">
    <!-- Left column: selectable lists -->
    <section class="user-list-container">
      <h2 class="visually-hidden">Lists</h2>
      <ul id="user-list" aria-label="Users"></ul>
      <ul id="stock-list" aria-label="Stocks"></ul>
    </section>

    <!-- Right column: form + portfolio + details -->
    <section class="details">

      <!-- User form -->
      <div class="UserForm">
        <h2>User Form</h2>
        <form class="userEntry">
          <input type="hidden" id="userID" />

          <label for="firstname">Name</label>
          <input id="firstname" type="text" placeholder="First name" />

          <label for="lastname" class="visually-hidden">Last Name</label>
          <input id="lastname" type="text" placeholder="Last name" />

          <label for="address">Address</label>
          <input id="address" type="text" placeholder="Street address" />

          <label for="city" class="visually-hidden">City</label>
          <input id="city" type="text" placeholder="City" />

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="name@example.com" />

          <div class="form-actions">
            <button type="button" id="btnSave">Save</button>
            <button type="button" id="btnDelete">Delete</button>
          </div>
        </form>
      </div>

      <!-- Portfolio -->
      <div class="Portfolio">
        <h2>Portfolio</h2>
        <table class="portfolio-table" aria-label="Portfolio">
          <thead>
            <tr>
              <th>Symbol</th>
              <th># Shares</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="portfolio-body"><!-- rows injected by JS --></tbody>
        </table>
      </div>

      <!-- Stock details -->
      <div class="StockDetails">
        <h2>Details</h2>
        <div class="stock-meta">
          <div><strong>Name</strong><p id="stockName"></p></div>
          <div><strong>Sector</strong><p id="stockSector"></p></div>
          <div><strong>Industry</strong><p id="stockIndustry"></p></div>
          <div><strong>Address</strong><p id="stockAddress"></p></div>
        </div>
      </div>

    </section>
  </main>

  <!-- load data first -->
  <script src="data/users.js"></script>
  <script src="data/stocks-complete.js"></script>
<!-- normalize data into window.USERS and window.STOCKS -->
<script>
(function () {
  // USERS
  try {
    if (!window.USERS) {
      if (typeof userContent === 'string') {
        window.USERS = JSON.parse(userContent);
      } else if (Array.isArray(window.users)) {
        window.USERS = window.users;
      } else if (typeof window.usersContent === 'string') {
        window.USERS = JSON.parse(window.usersContent);
      }
    }
  } catch (e) { window.USERS = []; }

  // STOCKS
  try {
    if (!window.STOCKS) {
      if (typeof stocksContent === 'string') {
        window.STOCKS = JSON.parse(stocksContent);
      } else if (Array.isArray(window.stocks)) {
        window.STOCKS = window.stocks;
      } else if (Array.isArray(window.stocksFormatted)) {
        window.STOCKS = window.stocksFormatted;
      } else if (Array.isArray(window.stockData)) {
        window.STOCKS = window.stockData;
      }
    }
  } catch (e) { window.STOCKS = []; }
})();
</script>

  <!-- then load your app logic -->
  <script src="script.js" defer></script>
</body>
</html>
