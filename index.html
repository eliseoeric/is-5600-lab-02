<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Portfolio Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Stock Portfolio Dashboard</h1>
        
        <div class="dashboard">
            <!-- Left Panel - User Management -->
            <div class="panel">
                <h2>Users</h2>
                <select id="user-select" class="dropdown">
                    <option value="">-- Select a user --</option>
                </select>
                
                <div class="user-form">
                    <h3>Edit User Information</h3>
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" placeholder="Enter name">
                    
                    <label for="user-email">Email:</label>
                    <input type="email" id="user-email" placeholder="Enter email">
                    
                    <div class="button-group">
                        <button id="save-user" class="btn btn-primary">Save Changes</button>
                        <button id="delete-user" class="btn btn-danger">Delete User</button>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel - Stock Information -->
            <div class="panel">
                <h2>Stock Information</h2>
                <select id="stock-select" class="dropdown">
                    <option value="">-- Select a stock --</option>
                </select>
                
                <div class="stock-info">
                    <p><strong>Symbol:</strong> <span id="stock-symbol">—</span></p>
                    <p><strong>Name:</strong> <span id="stock-name">—</span></p>
                    <p><strong>Current Price:</strong> <span id="stock-price">—</span></p>
                </div>
            </div>
        </div>
        
        <!-- Portfolio Section -->
        <div class="portfolio-section">
            <h2>Portfolio Holdings</h2>
            <table class="portfolio-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Shares</th>
                        <th>Value</th>
                        <th>Price/Share</th>
                    </tr>
                </thead>
                <tbody id="portfolio-table-body">
                    <!-- Portfolio data will appear here -->
                </tbody>
            </table>
            <div class="portfolio-total">
                <strong>Total Portfolio Value:</strong> <span id="portfolio-total">$0.00</span>
            </div>
        </div>
    </div>
    
    <!-- Load JavaScript files in correct order -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
