<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Portfolio Dashboard - Lab 02</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="left">
      <h2>Users</h2>
      <ul id="user-list" class="list"></ul>
      <button id="add-user-btn">Add Demo User</button>
    </section>

    <section class="middle">
      <h2>Portfolio</h2>
      <ul id="stock-list" class="list"></ul>
    </section>

    <section class="right">
      <h2>Stock Info</h2>
      <div id="stock-info">Select a stock to see details.</div>

      <h3>Edit User</h3>
      <form id="user-form">
        <label>
          Name
          <input id="user-name" type="text" required />
        </label>
        <label>
          Email
          <input id="user-email" type="email" required />
        </label>
        <div class="form-actions">
          <button id="save-btn" type="submit">Save</button>
          <button id="delete-btn" type="button">Delete</button>
        </div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
