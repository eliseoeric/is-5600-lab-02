<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Portfolio Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📈 User Stock Portfolio Dashboard</h1>

  <div class="dashboard">
    <!-- Left Panel: User List -->
    <section class="users">
      <h2>User List</h2>
      <ul id="user-list"></ul>
    </section>

    <!-- Middle Panel: Portfolio -->
    <section class="portfolio">
      <h2>Portfolio</h2>
      <ul id="portfolio-list"></ul>
      <div id="stock-info" class="stock-info"></div>
    </section>

    <!-- Right Panel: User Info -->
    <section class="user-info">
      <h2>User Information</h2>
      <form id="user-form">
        <label for="user-name">Name:</label>
        <input type="text" id="user-name" required>

        <label for="user-email">Email:</label>
        <input type="email" id="user-email" required>

        <button type="submit">Save</button>
      </form>
      <button id="delete-user" class="delete-btn">Delete User</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
